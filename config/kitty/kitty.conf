include ~/.config/kitty/catppuccin-mocha.conf

font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto

font_size 12.0

remember_window_size no

map ctrl+tab next_window
map ctrl+shift+tab previous_window
focus_follows_mouse yes
window_border_width 1.5pt
draw_minimal_borders yes
watcher focus_watcher.py
active_border_color #89b4fa
inactive_border_color #313244

dynamic_background_opacity yes
background_opacity 0.75
background_blur 1
text_composition_strategy legacy

allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-socket-{kitty_pid}
