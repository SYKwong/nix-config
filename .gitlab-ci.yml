default:
  timeout: 5 minutes

variables:
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  XDG_CACHE_HOME: "$CI_PROJECT_DIR/.cache"
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    warn-dirty = false
    eval-cache = true

stages:
  - test
  - maintenance
  - stable

verify-flake:
  stage: test
  image: nixos/nix:latest

  rules:
    # Only for merge requests
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      when: never

    # Skip draft/WIP MRs
    - if: '$CI_MERGE_REQUEST_TITLE =~ /^(Draft:|WIP:|\[Draft\])/i'
      when: manual
      allow_failure: true

    # Skip if changes are made in treefmt/
    - changes:
        - "treefmt/*"
      when: never

    # Run only when nix files changed
    - changes:
        - "**/*.nix"
        - "flake.lock"

    - when: manual
      allow_failure: true

  cache:
    key:
      files:
        - flake.lock
    paths:
      - .cache/nix
    fallback_keys:
      - nix-input-cache-default
  script:
    - nix fmt
    - |
      if ! git diff --quiet; then
        echo "Formatting changes detected. Run 'nix fmt' locally."
        git diff
        exit 1
      fi
    - nix flake check

verify-docs:
  stage: test
  image: node:lts-slim

  rules:
    # Only for merge requests
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'
      when: never

    # Skip draft/WIP MRs
    - if: '$CI_MERGE_REQUEST_TITLE =~ /^(Draft:|WIP:|\[Draft\])/i'
      when: manual
      allow_failure: true

    # Run only when docs config, dependencies, or styles changed
    - changes:
        - "docs/astro.config.mjs"
        - "docs/package.json"
        - "docs/package-lock.json"
        - "docs/tsconfig.json"
        - "docs/src/content.config.ts"
        - "docs/src/styles/**"

    - when: manual
      allow_failure: true

  cache:
    key:
      files:
        - docs/package-lock.json
    paths:
      - .cache/npm
    fallback_keys:
      - npm-cache-default
  script:
    - cd docs
    - npm ci --cache "$CI_PROJECT_DIR/.cache/npm" --ignore-scripts
    - npx --no-install astro build

update-flake-mr:
  stage: maintenance
  image: nixos/nix:latest
  rules:
    - if: $RUN_FLAKE_UPDATE == "true"
  before_script:
    - git config --global user.email "ci-bot@gitlab.com"
    - git config --global user.name "Nix Update Bot"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      # 1. Run the update
      nix flake update 2> update_summary.txt

      # 2. Check if flake.lock changed at all
      if git diff --exit-code flake.lock; then
        echo "No updates available."
        exit 0
      fi

      # 3. Only create an MR if nixpkgs was among the updated inputs
      if ! grep -q "Updated input 'nixpkgs':" update_summary.txt; then
        echo "flake.lock changed, but nixpkgs was not updated in this cycle. Skipping MR creation."
        exit 0
      fi

      # 4. Create a unique branch name and commit
      BRANCH_NAME="flake-update-$(date +%Y-%m-%d)"
      git checkout -b "$BRANCH_NAME"
      RAW_LINES=$(grep '•' update_summary.txt)
      SUMMARY="${RAW_LINES//•/*}"
      SUMMARY="${SUMMARY//$'\n'/\\n}"
      SUMMARY="${SUMMARY//:/ }"

      git add flake.lock
      git commit -m "chore(flake): update flake.lock"

      # 5. Close superseded open dependency update MRs and clean up their branches
      AUTH_HEADER=()
      if [ -n "$PROJECT_API_TOKEN" ]; then
        AUTH_HEADER=(-H "PRIVATE-TOKEN: $PROJECT_API_TOKEN")
      fi

      curl -s "${AUTH_HEADER[@]}" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests?state=opened&labels=dependencies&per_page=100" > open_mrs.json

      nix eval --impure --raw --expr '
        let
          raw = builtins.readFile ./open_mrs.json;
          data = builtins.fromJSON raw;
          old = if builtins.isList data then builtins.filter (mr: mr.source_branch != "'"$BRANCH_NAME"'") data else [];
        in
          builtins.concatStringsSep "\n" (builtins.map (mr: "${toString mr.iid} ${mr.source_branch}") old)
      ' 2>/dev/null | while read -r OLD_IID OLD_BRANCH; do
        if [ -n "$OLD_IID" ]; then
          if [ -n "$PROJECT_API_TOKEN" ]; then
            echo "Closing superseded MR !${OLD_IID}..."
            curl -s --request PUT "${AUTH_HEADER[@]}" \
              "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$OLD_IID?state_event=close" >/dev/null
          else
            echo "Note: PROJECT_API_TOKEN is not set; skipping API closure of MR !${OLD_IID}."
          fi
          echo "Deleting superseded remote branch ${OLD_BRANCH}..."
          git push origin --delete "$OLD_BRANCH" >/dev/null 2>&1 || true
        fi
      done
      rm -f open_mrs.json

      # Also clean up any lingering stale flake-update branches on remote
      git ls-remote --heads origin 'refs/heads/flake-update-*' | awk '{print $2}' | sed 's|^refs/heads/||' | while read -r REMOTE_BRANCH; do
        if [ -n "$REMOTE_BRANCH" ] && [ "$REMOTE_BRANCH" != "$BRANCH_NAME" ]; then
          echo "Deleting stale remote branch ${REMOTE_BRANCH}..."
          git push origin --delete "$REMOTE_BRANCH" >/dev/null 2>&1 || true
        fi
      done

      # 6. Push with MR creation options
      git push -f origin "$BRANCH_NAME" \
        -o merge_request.create \
        -o merge_request.target="$CI_DEFAULT_BRANCH" \
        -o merge_request.title="chore(flake): update flake.lock ($(date +%Y-%m-%d))" \
        -o merge_request.description="The following flake inputs were updated:\n$SUMMARY" \
        -o merge_request.remove_source_branch \
        -o merge_request.label="dependencies" \
        -o merge_request.assignee_id="$GITLAB_USER_ID" \
        -o merge_request.squash=true \
        -o merge_request.merge_when_pipeline_succeeds

create-weekly-stable:
  stage: stable
  image: alpine:latest

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $STABLE_RELEASE == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci-bot@gitlab.com"
    - git config --global user.name "Stable Release Bot"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

  script:
    - TAG_NAME="stable-$(date +%Y-%m-%d)"
    - echo "Creating stable tag $TAG_NAME at $CI_COMMIT_SHA"

    - git fetch --tags

    - |
      if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
        echo "Tag $TAG_NAME already exists."
        exit 1
      fi

    - git tag "$TAG_NAME" "$CI_COMMIT_SHA"
    - git push origin "$TAG_NAME"

    - |
      git tag -l 'stable-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]' \
        | sort -r \
        | tail -n +13 \
        | while read -r TAG; do
            echo "Deleting old stable tag: $TAG"
            git push origin --delete "$TAG"
          done
