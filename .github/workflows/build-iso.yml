name: Build Custom Installer ISO

on:
  schedule:
    # Monthly build on the 1st of every month at 04:00 UTC
    - cron: '0 4 1 * *'
  push:
    branches: [main]
    paths:
      - 'hosts/installer/**'
      - 'secrets/keys.nix'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:

concurrency:
  group: 'build-iso-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build Installer ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            warn-dirty = false

      - name: Disable private inputs for CI build
        run: |
          in_block=0
          while IFS= read -r line; do
            case "$line" in
              *"# BEGIN_PRIVATE_WALLPAPERS"*) in_block=1 ;;
            esac
            if [ "$in_block" -eq 1 ]; then
              echo "# $line"
            else
              echo "$line"
            fi
            case "$line" in
              *"# END_PRIVATE_WALLPAPERS"*) in_block=0 ;;
            esac
          done < flake.nix > flake.nix.tmp && mv flake.nix.tmp flake.nix

      - name: Build Installer ISO
        run: |
          nix build .#nixosConfigurations.installer.config.system.build.isoImage --no-write-lock-file --print-build-logs

      - name: Prepare ISO artifact and checksum
        id: prepare-artifact
        run: |
          mkdir -p dist
          iso_path=$(find result/iso -name "*.iso" | head -n 1)
          if [ -z "$iso_path" ]; then
            echo "Error: No ISO image found in result/iso" >&2
            exit 1
          fi
          echo "Found ISO: $iso_path"
          iso_name=$(basename "$iso_path")
          cp "$iso_path" "dist/$iso_name"
          (cd dist && sha256sum "$iso_name" > "$iso_name.sha256")
          echo "iso_name=$iso_name" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare-artifact.outputs.iso_name }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "installer-${{ steps.prepare-artifact.outputs.build_date }}-${{ steps.prepare-artifact.outputs.short_sha }}"
          name: "${{ steps.prepare-artifact.outputs.build_date }} (${{ steps.prepare-artifact.outputs.short_sha }}) · Installer ISO"
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.iso
            dist/*.sha256
